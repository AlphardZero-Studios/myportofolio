<dialog id="experience-delete-dialog" class="experience-dialog" aria-labelledby="experience-delete-title">
    <h2 id="experience-delete-title">Hapus Pengalaman?</h2>
    <p>
        Apakah Anda yakin ingin menghapus
        <strong id="experience-delete-name"></strong>?
    </p>
    <form id="experience-delete-form" class="experience-delete-modal__actions">
        <button type="button" class="button button-secondary" data-close>Batal</button>
        <button type="submit" class="button button-danger">Ya, Hapus</button>
    </form>
</dialog>
